services:
  mysql:
    image: mysql:8.4
    container_name: neverend-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-neverend_lab}
      MYSQL_USER: ${MYSQL_USER:-neverend}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-neverend_local_dev}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - neverend_mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  neverend_mysql_data:
